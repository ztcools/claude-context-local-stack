# =============================================================================
# claude-context 一体化部署 —— 四大服务
#   1. Milvus 向量数据库:  etcd / minio / standalone
#   2. Ollama 向量化推理:   ollama (GPU, 模型 nomic-embed-text)
#   3. git-index 定时索引:  git-index (每日 pull/clone GitLab 仓库并增量索引 main)
#   4. PhiGent Web 控制台:  phigent (Milvus 管理 + 索引树 + GitLab 仓库管理)
#
# 自建镜像(phigent / git-index)由 deploy.sh 从 ./images/*.tar.gz 加载,
# 基础镜像(milvus/ollama 等)使用本机已有镜像,均不联网拉取。
# 变量见 .env.example。服务间用容器名互访(standalone:19530 / ollama:11434)。
#
# 资源上限(deploy.resources.limits)
#   这台机器是共享的(96 核 / 376 GiB, 其他团队的容器也在上面跑)。所有服务都显式
#   封了内存和 CPU 上限,目的不是"省资源",而是把故障半径关在本栈内部: 一个失控
#   的索引任务应该是自己 OOM 被重启,而不是把整机拖垮、连带别人的容器被杀。
#   默认值合计约 126 GiB / 60 核,留出三分之二余量给其他人。用 .env 覆盖即可调整。
# =============================================================================

services:
  etcd:
    container_name: ${PROJECT_PREFIX:-claude}-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DATA_DIR:-./data}/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          # etcd 只存元数据(collection schema / segment 索引),量很小;
          # 上限主要防 compaction 期间的尖峰。
          memory: ${ETCD_MEM_LIMIT:-4g}
          cpus: "${ETCD_CPU_LIMIT:-2}"

  minio:
    container_name: ${PROJECT_PREFIX:-claude}-milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${DATA_DIR:-./data}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          # 对象存储层:内存用于上传缓冲,不随数据量线性增长。
          memory: ${MINIO_MEM_LIMIT:-8g}
          cpus: "${MINIO_CPU_LIMIT:-4}"

  standalone:
    container_name: ${PROJECT_PREFIX:-claude}-milvus-standalone
    image: milvusdb/milvus:v2.6.18
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DATA_DIR:-./data}/milvus:/var/lib/milvus
      # 覆盖配置:标量数据/索引/growing segment 走 mmap,把"集合极多"场景的常驻
      # 内存压到磁盘。见 assets/milvus-user.yaml 里的完整推导。
      - ./assets/milvus-user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          # 全栈最大的内存消耗方(query node 常驻 + growing segment)。配合
          # user.yaml 的 mmap 后实际占用远低于此;上限是"别人的容器不会被我们
          # 拖死"的硬保证。
          memory: ${MILVUS_MEM_LIMIT:-64g}
          cpus: "${MILVUS_CPU_LIMIT:-24}"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  ollama:
    container_name: ${PROJECT_PREFIX:-claude}-ollama
    image: ollama/ollama:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ${OLLAMA_DATA:-./data/ollama}:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_LOAD_TIMEOUT: 10m
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_NO_UPDATE_CHECK: "true"
      OLLAMA_NOPRUNE: "true"
      OLLAMA_GPU_MEMORY_FACTOR: "0.9"
      OLLAMA_PARALLEL_REQUESTS: ${OLLAMA_PARALLEL_REQUESTS:-32}
      OLLAMA_MAX_BATCH_SIZE: ${OLLAMA_MAX_BATCH_SIZE:-1024}
      OLLAMA_SCHED_SPREAD: "false"
      OLLAMA_NUM_GPUS: ${OLLAMA_NUM_GPUS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-8}
      OLLAMA_CPU_THREADS: ${OLLAMA_CPU_THREADS:-16}
    deploy:
      resources:
        limits:
          # 向量化在 GPU 上跑,容器内存主要是请求缓冲和模型加载暂存。
          memory: ${OLLAMA_MEM_LIMIT:-32g}
          cpus: "${OLLAMA_CPU_LIMIT:-16}"
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-all}
              capabilities: [gpu]

  git-index:
    container_name: ${PROJECT_PREFIX:-claude}-git-index
    image: claude-context-git-index:latest
    pull_policy: never
    restart: unless-stopped
    user: "${GIT_INDEX_UID:-1015}:${GIT_INDEX_GID:-1015}"
    ports:
      - "${GIT_INDEX_PORT:-8795}:8790"
    volumes:
      - ${GIT_INDEX_DATA:-./data/git-index}:/workdir
    environment:
      HOME: /tmp
      EMBEDDING_PROVIDER: Ollama
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBED_DIMENSION:-768}
      MILVUS_ADDRESS: standalone:19530
      EMBEDDING_CACHE_ENABLED: "true"
      GIT_INCREMENTAL_ENABLED: "true"
      GIT_LAYERED_ENABLED: "true"
      GIT_DELTA_MAX_FILES: "2000"
      GIT_SSL_NO_VERIFY: ${GIT_SSL_NO_VERIFY:-false}
      GIT_INDEX_SOURCE: config
      GIT_INDEX_WORKDIR: /workdir/repos
      GIT_INDEX_CONFIG_FILE: /workdir/git-index-config.json
      GIT_INDEX_RUN_ON_START: "false"
      GIT_INDEX_DAILY_HOUR: ${GIT_INDEX_DAILY_HOUR:-3}
      GIT_INDEX_HTTP_PORT: "8790"
      # 同时索引几个仓库。瓶颈是 Ollama 向量化而不是 CPU:实测吞吐 1→3→6 流几乎
      # 线性(27→75→136 embed/s),6 之后就平了(8 流 140、12 流 142),单流延迟却翻倍。
      # 默认取饱和点 6;换机器后按 .env.example 里的测法重新定。
      GIT_INDEX_CONCURRENCY: ${GIT_INDEX_CONCURRENCY:-6}
      # 每个 collection 写完就从 Milvus 内存里 release(见 milvus-user.yaml 的说明)。
      # 只有在"索引完立刻要搜"的调试场景才需要关掉。
      GIT_INDEX_RELEASE_AFTER: ${GIT_INDEX_RELEASE_AFTER:-true}
    deploy:
      resources:
        limits:
          # 每个并发 worker 一份 checkout + 分块/向量化流水线。实测单 worker 峰值
          # RSS 约 1 GiB(绝大部分是 tree-sitter 堆外缓冲),并发 6 最坏约 6 GiB。
          memory: ${GIT_INDEX_MEM_LIMIT:-16g}
          cpus: "${GIT_INDEX_CPU_LIMIT:-12}"
    depends_on:
      standalone:
        condition: service_healthy

  phigent:
    container_name: ${PROJECT_PREFIX:-claude}-phigent
    image: claude-phigent:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${PHIGENT_PORT:-18000}:3000"
    environment:
      MILVUS_URL: ${MILVUS_URL:-standalone:19530}
      GIT_INDEX_PORT: ${GIT_INDEX_PORT:-8795}
    volumes:
      - ./assets/phigent-env.sh:/app/build/env.sh:ro
    deploy:
      resources:
        limits:
          # 纯 Node 前端 + Milvus 代理,常驻很小。
          memory: ${PHIGENT_MEM_LIMIT:-2g}
          cpus: "${PHIGENT_CPU_LIMIT:-2}"
    depends_on:
      standalone:
        condition: service_healthy

networks:
  default:
    name: ${PROJECT_PREFIX:-claude}-net
